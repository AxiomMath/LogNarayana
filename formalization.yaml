    comparator_config: "Comparator/comparator.json"
    literature_dependencies:
    - statement: >
        `IntegralBinaryNestohedronRealization`: for every integral binary nestohedron
        $P \subseteq \mathbb{R}^r$ there is a permutation $\pi$ with $r - 1$ descents whose valid
        compositions are exactly the lattice points of $P$.
      source: "Fertilitopes, Theorems 3.1 and 3.2"
    - statement: >
        `RefinedFertilityFormula`: for every permutation $\pi$,
        $x D_\pi(x) = \sum_{q \in \mathcal{V}(\pi)} N_q(x)$, the sum over the valid compositions
        of $\pi$ of the products of Narayana polynomials.
      source: "Fertilitopes, Corollary 2.4"
    - statement: "`LorentzianNonnegLinearSubstitution`, as above."
      source: "Lorentzian polynomials, Theorem 2.10"
    - statement: "`LorentzianNonnegDerivative`, as above."
      source: "Lorentzian polynomials, Corollary 2.11"
    - statement: "`LorentzianMul`, as above."
