# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "LogNarayana"
  authors: [Kenny Lau]
  description: >
    `LogNarayana` is a formal proof of the log-concavity and real-rootedness results of
    *Log-Concavity in Narayana Transforms and Stack-Sorting Fibers* (arXiv:2611.13479). It proves
    Theorems 1.1-1.4, Corollaries 4.7 and 6.3, Theorem 7.1 and Proposition 9.5, taking the results
    they cite from the literature as hypotheses. The Lean files were generated by AxiomProver,
    Axiom Math's in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "Apache-2.0"

repository:
  role: "substantive-development"

sources:
  - title: "Log-Concavity in Narayana Transforms and Stack-Sorting Fibers"
    authors: [Colin Defant]
    id: "https://arxiv.org/abs/2611.13479"
    type: "article"
    location: "Theorems 1.1-1.4, Corollary 4.7, Corollary 6.3, Theorem 7.1 and Proposition 9.5"
    relationship: "formalizes"
    note: >
      Formalizes these results, conditional on the cited results below.
  - title: "Lorentzian polynomials"
    authors: [P. Branden, J. Huh]
    type: "article"
    location: "Ann. of Math. 192 (2020), 821-891"
    relationship: "background"
    note: "`LorentzianNonnegLinearSubstitution`, `LorentzianNonnegDerivative`, `LorentzianMul`, `BrandenHuhSymbolTheorem` and `NormalizedSupportPolyLorentzianOfMConvex`."
  - title: "The Lee-Yang and Polya-Schur programs. I. Linear operators preserving stability"
    authors: [J. Borcea, P. Branden]
    type: "article"
    location: "Invent. Math. 177 (2009), 541-569"
    relationship: "background"
    note: "`RealStablePreserverOfSymbol`."
  - title: "A unified approach to polynomial sequences with only real zeros"
    authors: [L. L. Liu, Y. Wang]
    type: "article"
    location: "Adv. in Appl. Math. 38 (2007), 542-560"
    relationship: "background"
    note: "`ShiftedNarayanaNegRealRoots`."
  - title: "Fertilitopes"
    authors: [C. Defant]
    type: "article"
    location: "Discrete Comput. Geom. 70 (2023), 713-752"
    relationship: "background"
    note: "`RefinedFertilityFormula` and `IntegralBinaryNestohedronRealization`."
  - title: "Sur les partitions non croisees d'un cycle"
    authors: [G. Kreweras]
    type: "article"
    location: "Discrete Math. 1 (1972), 333-350"
    relationship: "background"
    note: "`KrewerasBlockSizeCount`."

classification:
  arxiv: [math.CO]
  msc2020: [05A20, 05A05, 05B35, 26C10, 52B20]

status:
  scope: >
    Theorems 1.1-1.4, Corollaries 4.7 and 6.3, Theorem 7.1 and Proposition 9.5, conditional on
    the results of Branden-Huh, Borcea-Branden, Liu-Wang, Defant and Kreweras that each statement
    takes as a hypothesis.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "LogNarayana.Challenge.List.isUltraLogConcave_fiberDescentPolynomial"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
    literature_dependencies:
    - statement: >
        `NormalizedSupportPolyLorentzianOfMConvex`: for an M-convex set $J$ of multi-indices, the
        normalized support polynomial $\sum_{\alpha \in J} z^\alpha / \alpha!$ is Lorentzian.
      source: "Lorentzian polynomials, Theorem 3.10"
    - statement: >
        `LorentzianNonnegLinearSubstitution`: substituting nonnegative linear forms for the
        variables of a Lorentzian polynomial gives a Lorentzian polynomial.
      source: "Lorentzian polynomials, Theorem 2.10"
  - declaration: "LogNarayana.Challenge.List.isLogConcave_fiberDescentPolynomial"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
    literature_dependencies:
    - statement: "`NormalizedSupportPolyLorentzianOfMConvex`, as above."
      source: "Lorentzian polynomials, Theorem 3.10"
    - statement: "`LorentzianNonnegLinearSubstitution`, as above."
      source: "Lorentzian polynomials, Theorem 2.10"
  - declaration: "LogNarayana.Challenge.List.exists_isLaminar_basisGeneratingPolynomial_eq_fiberTopPolynomial"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
  - declaration: "LogNarayana.Challenge.List.isLorentzian_fiberTopPolynomial"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
    literature_dependencies:
    - statement: "`NormalizedSupportPolyLorentzianOfMConvex`, as above."
      source: "Lorentzian polynomials, Theorem 3.10"
  - declaration: "LogNarayana.Challenge.List.isLorentzian_fiberPeakPolynomial"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
    literature_dependencies:
    - statement: "`LorentzianNonnegLinearSubstitution`, as above."
      source: "Lorentzian polynomials, Theorem 2.10"
    - statement: >
        `LorentzianNonnegDerivative`: for a nonnegative vector $a$ and a Lorentzian polynomial
        $f$, the polynomial $\sum_i a_i \partial_i f$ is Lorentzian.
      source: "Lorentzian polynomials, Corollary 2.11"
    - statement: >
        `LorentzianMul`: the product of two Lorentzian polynomials is Lorentzian.
      source: "Lorentzian polynomials, Theorem 2.30 and Corollary 2.32"
    - statement: "`NormalizedSupportPolyLorentzianOfMConvex`, as above."
      source: "Lorentzian polynomials, Theorem 3.10"
    - statement: >
        `BrandenHuhSymbolTheorem`: a homogeneous linear operator whose algebraic symbol is
        Lorentzian maps Lorentzian polynomials to Lorentzian polynomials.
      source: "Lorentzian polynomials, Theorem 3.2"
  - declaration: "LogNarayana.Challenge.MvPolynomial.IsHomogeneous.hasOnlyNegativeRoots_narayanaTransform"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
    literature_dependencies:
    - statement: >
        `RealStablePreserverOfSymbol`: a linear operator whose algebraic symbol is real-stable
        maps each real-stable polynomial to zero or to a real-stable polynomial.
      source: "The Lee-Yang and Polya-Schur programs. I, Theorem 1.2"
    - statement: >
        `ShiftedNarayanaNegRealRoots`: for every $m$, the shifted Narayana polynomial of index
        $m$ has exactly $m$ distinct negative real zeros.
      source: "A unified approach to polynomial sequences with only real zeros, Proposition 3.2"
  - declaration: "LogNarayana.Challenge.MvPolynomial.splits_narayanaTransform_of_isRealStable"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
